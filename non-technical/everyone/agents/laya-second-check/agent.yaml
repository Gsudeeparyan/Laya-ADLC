# Microsoft Copilot agent, built from everyone/skills/second-check/SKILL.md by tools/build_agents.py
id: laya-second-check
skill: second-check
name: Laya Second Check
description: A second pair of eyes before you send or use something, especially if AI wrote it. Checks facts
  and figures against your source, recalculates the numbers, and spots invented details, personal data and
  promises Laya can't stand over. You get a clear verdict and the exact fixes.
capabilities:
  code_interpreter: true
  web_search: false
conversation_starters:
- title: Check this against the source
  text: I'll upload a draft and the document it's based on. Can you check the draft is right?
- title: Check an AI answer
  text: 'Copilot gave me this answer. What should I check before I use it? '
- title: Check the numbers
  text: I'll upload a report. Can you recalculate the figures and tell me if any are wrong?
- title: Before I send this
  text: 'This is going to a member. Is there anything I should fix before it goes? '
staff_guide:
  upload: The draft, and the document or data it came from. The check is only as good as the source you give it.
  you_get: A verdict (ready to use, fix first, or get someone to review), a numbered list of fixes, and a table
    showing each claim and whether your source backs it up.
  example: A summary says "members must claim within 6 months". The source says "should claim within 12 months".
    It flags both the wrong number and the change from "should" to "must".
  tips:
  - Give it the source. Without one it can check the arithmetic and the logic, but not the facts.
  - A "ready to use" verdict isn't sign-off. You're still responsible for what you send.

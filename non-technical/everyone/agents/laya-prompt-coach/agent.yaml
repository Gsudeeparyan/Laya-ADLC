# Microsoft Copilot agent, built from everyone/skills/prompt-coach/SKILL.md by tools/build_agents.py
id: laya-prompt-coach
skill: prompt-coach
name: Laya Prompt Coach
description: Turns your rough request into a clear prompt you can paste straight in, shows why it's better,
  and teaches you one tip each time. Bring it a bad answer from Copilot and it works out what was missing.
capabilities:
  code_interpreter: false
  web_search: false
conversation_starters:
- title: Help me ask this
  text: 'I want Copilot to help me with something, but I''m not sure how to ask. Here''s what I need: '
- title: Copilot got it wrong
  text: 'I asked Copilot this and the answer wasn''t what I wanted. Here''s what I asked, and what was wrong: '
- title: A prompt for a weekly job
  text: 'I do this task every week and I''d like a prompt I can reuse: '
- title: Teach me the basics
  text: How do I write a good prompt? Show me with an example from my kind of work.
staff_guide:
  upload: Nothing usually. Just tell it what you need in your own words, or paste the prompt you tried.
  you_get: A clear prompt ready to paste, a line on why it's better, and one tip to keep.
  example: '"make this email better" becomes a prompt that says who the email is for, what they need to do,
    the length and the tone. The tip: tell Copilot who it''s for.'
  tips:
  - You don't need any special words. Say it how you'd say it to a colleague.
  - Keep the prompts that work. Your team can reuse them.

staff_guide:
  upload: An existing SOP if there is one. Otherwise nothing - the agent walks through the process with
    you.
  you_get: A table of the steps, the pain points and improvement ideas, and a Standard Operating Procedure
    in Word with a flowchart.
  example: '"I need an SOP for how we handle a change of address request." The agent asks what happens
    first, who does it and in which system, step by step, then writes the SOP.'

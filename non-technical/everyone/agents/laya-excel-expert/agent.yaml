id: laya-excel-expert
skill: excel-expert
name: Laya Excel Expert
description: A senior Excel expert for any workbook. Tell me in plain words what to add, change, fix or
  tidy - rows, columns, formulas, lookups, dropdowns, highlights, sorting, duplicates, summaries, charts
  - and I'll make exactly that change, keep every formula, total and table working, and show you precisely
  which cells changed. Personal data is protected automatically.
capabilities:
  code_interpreter: true
  web_search: false
conversation_starters:
- title: Add rows
  text: 'Please add these rows to my spreadsheet: '
- title: Add a column
  text: 'Add a new column to my spreadsheet called '
- title: Update rows that match
  text: 'In my spreadsheet, for every row where '
- title: Add a lookup
  text: 'Bring in a column from another sheet by matching '
- title: Summary with chart
  text: 'Make a summary of my data by '
- title: Fix my formulas
  text: Some formulas in my spreadsheet are broken. Can you fix them?
- title: Why is this total wrong?
  text: 'A number in my spreadsheet looks wrong. The cell is '
staff_guide:
  upload: Any Excel workbook (.xlsx). Your original is never changed - you get an updated copy.
  you_get: The same workbook with exactly the change you asked for, every formula, total, dropdown and
    chart still working, and a list of the cells that changed.
  example: Upload a claims list and say "Add a Priority column after Status with High, Medium and Low,
    set the closed ones to Low, and add a summary of amounts by team with a chart." You get the updated
    file, with the totals row still adding up and a live summary sheet.
  tips:
  - Say what you want, not how - 'add these three rows' is enough.
  - Totals, lookups and dropdowns that covered the whole list are extended automatically when rows are
    added.
  - Deleted or duplicate rows are kept on a 'Deleted rows' sheet, so nothing is lost.

# Microsoft Copilot agent, built from everyone/skills/pii-guard/SKILL.md by tools/build_agents.py
id: laya-pii-guard
skill: pii-guard
name: Laya PII Guard
description: Checks Excel, Word, CSV or pasted text for personal data - names, PPS numbers, dates of birth,
  contact details, Eircodes, bank and card numbers, member/policy numbers and health details - and removes
  it. Get a clean copy safe for any AI tool (with a private key to put real values back), an anonymised
  copy for sharing, or an answer about your data without exposing anyone.
capabilities:
  code_interpreter: true
  web_search: false
conversation_starters:
- title: Does this have PII?
  text: Check this file for personal data.
- title: Make a clean copy
  text: Remove the personal data from this file so I can use it with AI, but let me put the real values
    back later.
- title: Anonymise to share
  text: Make an anonymised copy of this file that I can share.
- title: Answer safely
  text: 'Answer this question about my data without exposing anyone''s details: '
- title: Put real values back
  text: Here's my cleaned file and its key - please put the real values back.
staff_guide:
  upload: The file (Excel, Word, CSV) or paste the text. To restore later, the cleaned file plus its key
    file.
  you_get: A privacy summary of what was found and where; a clean copy (with tokens like PERSON_001) and
    a private key file, or an anonymised copy to share.
  example: Upload a complaints export and choose 'clean copy'. You learn it has 340 member names, 212
    phone numbers and some health details, and you get a clean copy to use with the other agents plus
    a key file to keep privately.
  tips:
  - Keep the key file private - it holds the real values. Never put it in a shared folder.
  - For very sensitive files, use the Laya Excel Expert for SharePoint or the PII Scrubber on your PC,
    so the AI never sees the raw data.
  - Glance at the report - unusual names or scanned images can be missed.
